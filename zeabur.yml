# Zeabur 部署配置 (https://zeabur.com)
# 声明 Streamlit 启动方式,避免 Zeabur 猜错入口

services:
  - name: ai-content-generator
    type: streamlit
    # Zeabur 会自动读取 requirements.txt 安装依赖
    # 启动命令：监听 $PORT 环境变量(云平台注入),否则本地默认 8501
    run: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0
    # 环境变量(密钥)在 Zeabur 网页的 Variables 里配,不要写进代码
    # DEEPSEEK_API_KEY=<在网页填>
